<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_theme.css"><title>左边写什么约定，右边就用对应的测试去核</title></head>
<body><div class="page">
<p class="kicker">第 2 章示意图 · V 模型</p>
<h1>左边写什么约定，右边就用对应的测试去核</h1>
<p class="lead">价值不在字母 V，而在「工作产品 ↔ 测试」成对。不要把系统设计对到系统测试。</p>

    <div class="card">
      <table style="width:100%;border-collapse:collapse;font-size:18px">
        <tr style="background:#e2e8f0"><th style="padding:10px 12px;text-align:left">开发侧工作产品</th><th style="padding:10px 12px;text-align:left">对应的测试</th></tr>
        <tr><td style="padding:10px 12px;border-top:1px solid #cbd5e1">业务 / 用户需求</td><td style="padding:10px 12px;border-top:1px solid #cbd5e1">验收测试</td></tr>
        <tr style="background:#ccfbf1"><td style="padding:10px 12px">系统需求</td><td style="padding:10px 12px"><b>系统测试</b></td></tr>
        <tr><td style="padding:10px 12px;border-top:1px solid #cbd5e1">系统设计 / 架构</td><td style="padding:10px 12px;border-top:1px solid #cbd5e1"><b>集成测试</b></td></tr>
        <tr><td style="padding:10px 12px;border-top:1px solid #cbd5e1">详细设计 / 组件</td><td style="padding:10px 12px;border-top:1px solid #cbd5e1">组件（单元）测试</td></tr>
      </table>
    </div>
    <div class="card" style="margin-top:16px;background:#fef3c7;">记反是常见错：系统设计 ↔ 集成测试；系统需求 ↔ 系统测试。</div>
    
<p class="caption">示意图：左侧写约定时就要想右侧怎么验证。动态测试仍可更早用评审补上。</p>
</div></body></html>
