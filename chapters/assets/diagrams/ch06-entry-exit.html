<h1>什么时候能开始测，什么时候能说这轮测完了</h1>
<p class="lead">通过率 100% 只描述已经执行的范围。范围里漏了超库存，就不能拿它当出口。</p>
<div class="row"><div class="col card"><span class="tag tag-info">入口</span><h2>具备开始的条件</h2><p style="font-size:16px;line-height:1.55">构建可部署、冒烟过、账号和教学库可用、PRD 已基线。</p></div><div class="col card"><span class="tag tag-ok">出口</span><h2>计划中的测试能否结束</h2><p style="font-size:16px;line-height:1.55">P0 执行完、无未关闭 P0 缺陷、风险已评估、报告已写。</p></div></div>
<p class="caption">示意图：达不到标准时记录偏差，而不是偷偷改标准。上线是剩余风险可接受，不是缺陷为零。</p>
