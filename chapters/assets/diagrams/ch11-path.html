<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_theme.css"><title>终端里的「当前目录」是你的位置，命令默认就在这里动手</title></head>
<body><div class="page">
<p class="kicker">第 11 章示意图 · 你现在站在哪</p>
<h1>终端里的「当前目录」是你的位置，命令默认就在这里动手</h1>
<p class="lead">pwd 问位置，ls 看周围，cd 搬家。rm 之前必须确认路径，不要靠感觉。</p>

    <div class="card" style="font-family:ui-monospace,Menlo,monospace;font-size:16px;background:#0f172a;color:#e2e8f0">
      $ pwd<br>
      /Users/you/project/minishop<br><br>
      $ ls<br>
      README.md   server.py   tests/   logs/   evidence/
    </div>
    <p style="margin-top:12px">相对路径 <span class="mono">logs/app.log</span> 是从当前位置算的。写错目录再 rm，可能删掉别人的文件。</p>
    
<p class="caption">示意图：课程证据在 project/minishop/evidence/linux/。危险命令不得在未授权环境复述执行。</p>
</div></body></html>
