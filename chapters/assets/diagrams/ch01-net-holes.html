<p class="kicker">第 1 章示意图 · 原则一</p>
<h1>渔网捞上来的，不能证明海里没有鱼</h1>
<p class="lead">测了 100 条没发现缺陷，只说明这张网捞过的那片水。没捞到的路径、数据、环境里仍可能有问题。</p>
<div class="row"><div class="col card"><span class="tag tag-ok">已经测过</span><h2>网里有货</h2><p style="font-size:16px;line-height:1.55">登录成功、错误密码 401、qty=11 被拒绝。这些是证据。</p></div><div class="col card"><span class="tag tag-warn">网没盖住</span><h2>还可能有鱼</h2><p style="font-size:16px;line-height:1.55">没测过的浏览器、没想到的并发、空搜索 BUG-001 这种已知漏洞。</p></div><div class="col card"><span class="tag tag-info">放行话术</span><h2>不是原则定义</h2><p style="font-size:16px;line-height:1.55">「当前范围内未发现阻塞上线的已知严重缺陷」是结论写法，不是「系统没有 Bug」。</p></div></div>
<p class="caption">示意图：测试证明缺陷存在，不能证明缺陷不存在。无缺陷谬论见原则七。</p>
</div></body></html>
