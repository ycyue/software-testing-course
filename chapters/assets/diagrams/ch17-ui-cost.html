<h1>店门一改装修，假顾客脚本就要跟着改</h1>
<p class="lead">按钮改 class、多等 0.3 秒、验证码弹层，UI 脚本比接口更容易红。所以只留关键路径。</p>
<div class="row"><div class="col card"><span class="tag tag-ok">接口脚本</span><h2>对着窗口下单</h2><p style="font-size:16px;line-height:1.55">路径和 JSON 稳定时，改按钮文案不会弄红。</p></div><div class="col card"><span class="tag tag-warn">UI 脚本</span><h2>假装顾客进店</h2><p style="font-size:16px;line-height:1.55">选择器、等待、弹窗、浏览器差异都要养。time.sleep 当默认等待会更脆。</p></div></div>
<p class="caption">示意图：录制一遍不等于会 Playwright。简历不要写精通 UI 自动化。</p>
