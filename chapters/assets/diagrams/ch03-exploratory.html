<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_theme.css"><title>探索性测试带着目标和时间盒，不是随便点</title></head>
<body><div class="page">
<p class="kicker">第 3 章示意图 · 探索性测试</p>
<h1>探索性测试是带着目标和时间盒边学边测</h1>
<p class="lead">没有用例也可以测，但不能没有目标、时间和记录。</p>
<div class="row">
  <div class="col card">
    <span class="tag tag-ok">探索</span>
    <h2>有结构</h2>
    <p style="font-size:16px;line-height:1.55">目标：购物车数量有哪些异常<br>时间盒：45 分钟<br>边测边记下一步</p>
  </div>
  <div class="col card">
    <span class="tag tag-bad">不是探索</span>
    <h2>无结构</h2>
    <p style="font-size:16px;line-height:1.55">无目标<br>无记录<br>超时还在点</p>
  </div>
</div>
<p class="caption">示意图：探索可以补充脚本化用例，不能取消计划和记录。</p>
</div></body></html>
