<h1>一栋房子：结构、装修、电路</h1>
<p class="lead">三种技术会互相影响，但测试时先问「坏的是墙、油漆还是电」。</p>
<div class="row"><div class="col card"><span class="tag tag-info">HTML</span><h2>结构 / 语义</h2><p style="font-size:16px;line-height:1.55">这里是标题、这里是按钮、这里是密码框。没有它，页面没有骨架。</p></div><div class="col card"><span class="tag tag-ok">CSS</span><h2>呈现 / 布局</h2><p style="font-size:16px;line-height:1.55">卡片有边框、按钮对齐。CSS 没加载，内容可能还在，只是「没装修」。</p></div><div class="col card"><span class="tag tag-warn">JavaScript</span><h2>动态行为</h2><p style="font-size:16px;line-height:1.55">点击后文字变成「已加入购物车」。脚本报错时，页未必打不开，只是按钮没反应。</p></div></div>
<p class="caption">示意图：能点按钮 ≠ 订单已写入后端。组合练习页见 assets/07-html-combo.html。</p>
