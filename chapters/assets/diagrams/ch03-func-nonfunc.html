<body><div class="page">
<p class="kicker">第 3 章示意图 · 功能与非功能</p>
<h1>「做对了」和「做得好」不是同一张考卷</h1>
<p class="lead">功能问结果对不对。非功能问以什么质量完成。两者都可能阻塞上线。</p>
<div class="row"><div class="col card"><span class="tag tag-ok">功能</span><h2>做了什么</h2><p style="font-size:16px;line-height:1.55">正确密码能否登录；qty=11 是否被拒；订单 Body 有没有 status。</p></div><div class="col card"><span class="tag tag-warn">非功能</span><h2>做得怎样</h2><p style="font-size:16px;line-height:1.55">搜索是否够快、手机能不能用、会不会挂、提示好不好懂。阈值来自需求。</p></div></div>
<p class="caption">示意图：越权返回 403 可以当功能需求测；评估整套访问控制抵御风险时，才更像安全测试。分类要说目标。</p>
</div></body></html>
