<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_theme.css"><title>能下单，不等于质量好</title></head>
<body><div class="page">
<p class="kicker">第 1 章示意图 · 软件质量</p>
<h1>能下单，不等于质量好</h1>
<p class="lead">功能只是其中一面。首页 20 秒、Safari 错位、随机崩溃、密码明文，都是质量问题。</p>
<div class="row"><div class="col card"><span class="tag tag-ok">功能适合性</span><h2>结果对不对</h2><p style="font-size:16px;line-height:1.55">正确密码能否登录；qty=11 是否被拒。</p></div><div class="col card"><span class="tag tag-warn">性能效率</span><h2>快不快、撑不撑</h2><p style="font-size:16px;line-height:1.55">响应时间、吞吐。阈值来自需求，不是教材数字。</p></div><div class="col card"><span class="tag tag-info">兼容 / 交互</span><h2>谁都能用吗</h2><p style="font-size:16px;line-height:1.55">浏览器、视口、按钮是否找得到。</p></div><div class="col card"><span class="tag tag-bad">可靠 / 安全</span><h2>稳不稳、防不防</h2><p style="font-size:16px;line-height:1.55">会不会挂；账号和权限会不会漏。</p></div></div>
<p class="caption">示意图：ISO/IEC 25010:2023 还有可维护性、灵活性、安全保障性。初学先记住「质量是多面的」。</p>
</div></body></html>
