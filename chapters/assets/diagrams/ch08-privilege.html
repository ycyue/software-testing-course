<p class="kicker">第 8 章示意图 · 横向越权和纵向越权</p>
<h1>同级偷看别人的柜子，和员工进了经理室，不是同一类钥匙问题</h1>
<p class="lead">都叫权限问题，报告里要写清两个账号的角色、URL 和实际看到的数据。</p>
<div class="row"><div class="col card"><span class="tag tag-warn">横向</span><h2>同级访问他人资源</h2><p style="font-size:16px;line-height:1.55">用户 B 请求用户 A 的 GET /api/orders/{id}，看到了 A 的订单。</p></div><div class="col card"><span class="tag tag-bad">纵向</span><h2>低权限做了高权限的事</h2><p style="font-size:16px;line-height:1.55">失效示例是普通用户打 /api/admin/products 得到 200。打开 /admin.html 静态页 200 ≠ API 403。</p></div></div>
<p class="caption">示意图：隐藏菜单 ≠ 权限。静态页 200 ≠ API 403。直接访问接口、换账号、换窗口都要测。只在授权教学账号上做。</p>
</div></body></html>
