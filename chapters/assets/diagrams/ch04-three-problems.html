<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_theme.css"><title>需求出问题，通常是这三种样子</title></head>
<body><div class="page">
<p class="kicker">第 4 章示意图 · 歧义、遗漏、矛盾</p>
<h1>需求出问题，通常是这三种样子</h1>
<p class="lead">测试提前介入，首先是把这三类标出来，而不是替产品选一个自己喜欢的解释。</p>
<div class="row"><div class="col card"><span class="tag tag-warn">歧义</span><h2>一句话多种读法</h2><p style="font-size:16px;line-height:1.55">「尽快」是 2 秒还是 2 天？谁在哪种网络下测？</p></div><div class="col card"><span class="tag tag-bad">遗漏</span><h2>该写的没写</h2><p style="font-size:16px;line-height:1.55">密码连续输错怎么办？冻结账号何时恢复？</p></div><div class="col card"><span class="tag tag-info">矛盾</span><h2>两份文件打起来</h2><p style="font-size:16px;line-height:1.55">PRD 最少 8 位，原型写 6 位，接口 minLength 10。</p></div></div>
<p class="caption">示意图：矛盾时不要为三个版本各写预期。推动唯一基线后再测。</p>
</div></body></html>
