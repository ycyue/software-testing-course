<h1>换浏览器坏了，和缩窗口坏了，不是同一类报告</h1>
<p class="lead">兼容性看运行环境组合。响应式看同一环境下不同视口能否完成操作。</p>
<div class="row"><div class="col card"><span class="tag tag-info">兼容性</span><h2>换环境</h2><p style="font-size:16px;line-height:1.55">Chrome 能登录，Safari 失败。要写浏览器、版本、系统。</p></div><div class="col card"><span class="tag tag-warn">响应式</span><h2>换宽度</h2><p style="font-size:16px;line-height:1.55">所有浏览器在 375px 下按钮被挡住。要写视口，不要只说「手机不行」。</p></div></div>
<p class="caption">示意图：产品只保证 Chrome 时，范围外浏览器列入未测项，而不是默认为通过。</p>
