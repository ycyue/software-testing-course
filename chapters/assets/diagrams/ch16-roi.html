<p class="lead">接口往往比 UI 便宜，但不是永远比手工更划算。没有契约、环境天天挂，脚本会变成新负担。</p>
<div class="row"><div class="col card"><span class="tag tag-ok">适合先自动</span><h2>稳定、重复、能判断</h2><p style="font-size:16px;line-height:1.55">登录、qty 组合、每次构建的回归、权限和重复提交。</p></div><div class="col card"><span class="tag tag-warn">不要当第一步</span><h2>不稳、没预期、一次性</h2><p style="font-size:16px;line-height:1.55">每周大改的 UI 文案、探索性测试、一次性线上核对。</p></div></div>
