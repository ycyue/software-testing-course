<p class="kicker">第 4 章示意图 · 四个容易混的词</p>
<h1>依据、需求、条件、用例，一层比一层更可执行</h1>
<p class="lead">企业模板名字会变。课程要保住的是：每条测试都能追到依据，并且能判断过/不过。</p>
<div class="row"><div class="col card"><span class="tag tag-info">测试依据</span><h2>根据什么来测</h2><p style="font-size:16px;line-height:1.55">PRD、原型、OpenAPI、已确认规则</p></div><div class="col card"><span class="tag tag-ok">测试需求</span><h2>要验证哪些要求</h2><p style="font-size:16px;line-height:1.55">购物车数量不能超过可售库存</p></div><div class="col card"><span class="tag tag-warn">测试条件 / 点</span><h2>检查哪个角度</h2><p style="font-size:16px;line-height:1.55">等于库存、超过库存、库存变化</p></div><div class="col card"><span class="tag tag-bad">测试用例</span><h2>怎么做、怎样算过</h2><p style="font-size:16px;line-height:1.55">库存 10，输入 11，应拒绝。失败后原值是否保持：PRD 未写则待确认</p></div></div>
<p class="caption">示意图：测试点还不一定有完整步骤。写成用例之后，别人才能量着做。</p>
</div></body></html>
